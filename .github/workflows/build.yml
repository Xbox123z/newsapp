name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build desktop
        run: |
          npm i -g @tauri-apps/cli@^2
          cd src-tauri
          cargo build --release --locked

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item src-tauri/target/release/breeze.exe out/Breeze.exe
          Compress-Archive -Path out/Breeze.exe -DestinationPath Breeze-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Breeze-windows
          path: Breeze-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Build APK
        run: |
          npm i -g @tauri-apps/cli@^2
          tauri android build --apk --debug --target aarch64 armv7

      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/Breeze-android.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: Breeze-android
          path: out/Breeze-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Breeze-windows/Breeze-windows.zip
            artifacts/Breeze-android/Breeze-android.apk
